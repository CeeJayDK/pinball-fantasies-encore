name: macOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false     # one architecture failing must not cancel the other
      matrix:
        include:
          - { runner: macos-15, arch: arm64 }
          - { runner: macos-15-intel, arch: x86_64 }
    steps:
      - uses: actions/checkout@v5

      - name: Install SDL3
        run: brew install sdl3

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_PREFIX_PATH="$(brew --prefix)" -DENCORE_BUNDLE_GAME=OFF

      - name: Build
        run: cmake --build build -j3

      # The tests that need the original game files skip themselves when the files are not
      # there, which they never are here: the game's data is not redistributable.
      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Check the application was assembled
        run: |
          app="build/Pinball Fantasies.app/Contents"
          test -x "$app/MacOS/Pinball Fantasies"
          test -f "$app/Resources/icon.icns"
          test -f "$app/Resources/shaders/post.frag"
          test -f "$app/Resources/hd/playfield1_on.png"
          test -x build/encore-play && test -x build/encore-assets && test -x build/encore-extract

      # SDL is linked from wherever Homebrew put it, so a copy travels inside the application
      # and the binary is pointed at it. Modifying the binary voids its signature, so it is
      # signed again, without a certificate, which is all an unsigned application needs.
      - name: Bundle SDL into the application
        run: |
          app="build/Pinball Fantasies.app"
          bin="$app/Contents/MacOS/Pinball Fantasies"
          mkdir -p "$app/Contents/Frameworks"
          sdl=$(otool -L "$bin" | awk '/libSDL3/ {print $1}')
          cp "$sdl" "$app/Contents/Frameworks/"
          install_name_tool -change "$sdl" "@executable_path/../Frameworks/$(basename "$sdl")" "$bin"
          codesign --force --sign - --deep "$app"
          otool -L "$bin" | head -3

      - name: Package
        run: |
          cd build
          ditto -c -k --sequesterRsrc --keepParent "Pinball Fantasies.app" "../pinball-fantasies-encore-macos-${{ matrix.arch }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: pinball-fantasies-encore-macos-${{ matrix.arch }}
          path: pinball-fantasies-encore-macos-${{ matrix.arch }}.zip
          if-no-files-found: error
